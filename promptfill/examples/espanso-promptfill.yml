# Espanso match — launcher for promptfill GUI (cross-platform).
#
# Install: copy into your Espanso match folder or use espanso-prompts (;p).
# Set ABSOLUTE repo root below, or use Espanso vars / PROMPT_REPO_ROOT.
#
# Flow: ;pf → promptfill desktop window → fill → clipboard

matches:
  - trigger: ";pf"
    replace: "{{output}}"
    force_mode: keys
    vars:
      - name: output
        type: shell
        params:
          cmd: |
            (
              sleep 0.2
              PROMPTFILL_LAUNCH_NOW=1 python3 "$CONFIG/scripts/promptfill-launch.py" "/ABS/PATH/TO/ai-use-optimizer"
            ) >/dev/null 2>&1 &

# Prefer espanso-prompts scripts/promptfill-launch.py + {{prompt_repo_root}} when using that repo.
