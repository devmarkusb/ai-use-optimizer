# Espanso match — thin launcher for promptfill (macOS example).
#
# Install: copy this file into your Espanso match folder (any location), e.g.
#   ~/.config/espanso/match/promptfill.yml
# Espanso does not need to live inside the ai-use-optimizer repo.
#
# You must set ABSOLUTE paths below (or via Espanso vars — see bottom).
#
# Flow: ;pf → Terminal → picker → fill → clipboard

matches:
  - trigger: ";pf"
    replace: ""
    force_clipboard: false
    backend: shell
    shell:
      cmd: |
        osascript -e 'tell application "Terminal" to activate' \
          -e 'tell application "Terminal" to do script "cd /ABS/PATH/TO/ai-use-optimizer && uv run --directory promptfill promptfill"'

# --- Paths (pick one approach) ---
#
# 1) Hardcode in the match (simplest): replace /ABS/PATH/TO/ai-use-optimizer with e.g.
#      /Users/user/dev/ai-use-optimizer
#    `promptfill` subdir is relative to that root via `--directory promptfill`.
#
# 2) Espanso custom var (config.yml next to your other espanso files):
#
#    custom_vars:
#      - name: repo_root
#        type: shell
#        params:
#          cmd: 'echo -n /Users/user/dev/ai-use-optimizer'
#
#    Then in the match use:
#      cd {{repo_root}} && uv run --directory promptfill promptfill
#
# 3) No cd — set prompts dir only (repo root can be anywhere):
#
#      PROMPTFILL_PROMPTS_DIR=/ABS/PATH/TO/ai-use-optimizer/prompts \
#        uv run --directory /ABS/PATH/TO/ai-use-optimizer/promptfill promptfill
#
# --- Requirements ---
# - `uv` on PATH in the shell Terminal starts (login PATH issues: use full path to uv if needed)
# - Once per clone: cd .../promptfill && uv sync
#
# Shorthand by stem (no picker):
#   ... promptfill project-start
