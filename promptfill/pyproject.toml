[project]
name = "promptfill"
version = "0.1.0"
description = "Fill angle-bracket placeholders in Markdown prompts and copy to clipboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
promptfill = "promptfill.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptfill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
